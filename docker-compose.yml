services:
  backend:
    build:
      context: ./backend
    environment:
      NOVA_ENV: ${NOVA_ENV:-development}
      NOVA_API_HOST: 0.0.0.0
      NOVA_API_PORT: 8000
      NOVA_CORS_ORIGINS: ${NOVA_CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

