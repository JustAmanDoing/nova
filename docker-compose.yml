services:
  backend:
    build:
      context: ./backend
    environment:
      NOVA_ENV: ${NOVA_ENV:-development}
      NOVA_API_HOST: 0.0.0.0
      NOVA_API_PORT: 8000
      NOVA_CORS_ORIGINS: ${NOVA_CORS_ORIGINS:-http://localhost:5173}
      NOVA_INTAKE_PATH: /intake
      NOVA_DATABASE_PATH: /data/nova.db
      NOVA_INTAKE_SCAN_SECONDS: ${NOVA_INTAKE_SCAN_SECONDS:-3}
      NOVA_MAX_TEXT_BYTES: ${NOVA_MAX_TEXT_BYTES:-1000000}
      NOVA_MAX_EXTRACTED_TEXT_BYTES: ${NOVA_MAX_EXTRACTED_TEXT_BYTES:-1000000}
    volumes:
      - ./data/intake:/intake:ro
      - nova_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nova_data:
