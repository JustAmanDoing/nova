name: Continuous verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/constraints.txt
      - name: Install backend
        run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check app tests
      - name: Type check
        run: python -m mypy app
      - name: Test
        run: python -m pytest

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@9.15.5 --activate
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  windows-controls:
    name: Windows controls
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate launchers and controller
        shell: powershell
        run: .\scripts\Test-NovaScripts.ps1

  containers:
    name: Production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production containers
        run: docker compose build
      - name: Create isolated intake fixture
        run: |
          mkdir -p data/intake
          printf '%s\n' \
            'NOVA TEST DOCUMENT' \
            'Document type: Invoice' \
            'Invoice number: CI-2026-001' \
            'Invoice date: 25-07-2026' \
            'Supplier: Nova Runtime Verification' \
            'Total: $35.15 AUD' \
            > data/intake/ci-smoke-invoice.txt
      - name: Start production stack
        run: docker compose up --detach --wait --wait-timeout 120
      - name: Verify API, dashboard, and intake
        run: |
          docker compose exec -T backend python -c \
            "from pathlib import Path; fields = next(line for line in Path('/proc/1/status').read_text().splitlines() if line.startswith('Uid:')).split(); assert fields[1] != '0', fields"
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/v1/health \
            | grep --fixed-strings --quiet '"status":"ok"'
          api_response_headers="$(
            curl --fail --silent --show-error \
              --dump-header - --output /dev/null \
              http://127.0.0.1:8000/api/v1/health
          )"
          printf '%s\n' "$api_response_headers" \
            | grep --ignore-case --quiet '^cache-control: no-store'
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/v1/system/status \
            | grep --fixed-strings --quiet '"last_scan_status":"ok"'
          curl --fail --silent --show-error \
            http://127.0.0.1:5173/ \
            | grep --fixed-strings --quiet '<title>Nova</title>'
          response_headers="$(
            curl --fail --silent --show-error --head \
              http://127.0.0.1:5173/
          )"
          printf '%s\n' "$response_headers" \
            | grep --ignore-case --quiet '^content-security-policy:'
          printf '%s\n' "$response_headers" \
            | grep --ignore-case --quiet '^x-content-type-options: nosniff'
          printf '%s\n' "$response_headers" \
            | grep --ignore-case --quiet '^x-frame-options: deny'
          printf '%s\n' "$response_headers" \
            | grep --ignore-case --quiet '^cache-control: no-cache'
          if curl --fail --silent --output /dev/null \
            --header 'Host: unexpected.example' \
            http://127.0.0.1:5173/
          then
            echo 'Dashboard accepted an unexpected Host header.'
            exit 1
          fi
          if curl --fail --silent --output /dev/null \
            --header 'Host: unexpected.example' \
            http://127.0.0.1:8000/api/v1/health
          then
            echo 'API accepted an unexpected Host header.'
            exit 1
          fi
          indexed=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/api/v1/intake/files \
              | grep --fixed-strings --quiet \
                  '"original_name":"ci-smoke-invoice.txt"'
            then
              indexed=true
              break
            fi
            sleep 2
          done
          test "$indexed" = true
      - name: Exercise approval, recovery, and backup boundaries
        run: |
          api='http://127.0.0.1:8000/api/v1'
          intent='X-Nova-Intent: local-user-action'
          files="$(
            curl --fail --silent --show-error "$api/intake/files"
          )"
          file_id="$(
            printf '%s' "$files" \
              | jq --exit-status --raw-output \
                  '.[] | select(.original_name == "ci-smoke-invoice.txt") | .id'
          )"
          recommendation="$(
            printf '%s' "$files" \
              | jq --exit-status --raw-output \
                  '.[] | select(.id == "'"$file_id"'") | .recommendation.outcome'
          )"
          test "$recommendation" = 'suggested'

          approval="$(
            curl --fail --silent --show-error \
              --request PUT \
              --header "$intent" \
              --header 'Content-Type: application/json' \
              --data '{"action":"approve"}' \
              "$api/intake/files/$file_id/approval"
          )"
          test "$(printf '%s' "$approval" | jq --raw-output '.status')" = 'approved'

          move="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "$intent" \
              "$api/intake/files/$file_id/execute"
          )"
          test "$(printf '%s' "$move" | jq --raw-output '.status')" = 'succeeded'
          test "$(printf '%s' "$move" | jq --raw-output '.can_undo')" = 'true'
          operation_id="$(printf '%s' "$move" | jq --raw-output '.operation_id')"
          destination="$(
            printf '%s' "$move" | jq --raw-output '.destination_path'
          )"
          test ! -e data/intake/ci-smoke-invoice.txt
          test -f "data/library/$destination"

          actions="$(
            curl --fail --silent --show-error "$api/intake/actions"
          )"
          printf '%s' "$actions" \
            | jq --exit-status \
                '.[] | select(
                  .operation_id == "'"$operation_id"'"
                  and .status == "succeeded"
                  and .can_undo == true
                )' \
            > /dev/null

          undo="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "$intent" \
              "$api/intake/actions/$operation_id/undo"
          )"
          test "$(printf '%s' "$undo" | jq --raw-output '.kind')" = 'undo'
          test "$(printf '%s' "$undo" | jq --raw-output '.status')" = 'succeeded'
          test -f data/intake/ci-smoke-invoice.txt
          test ! -e "data/library/$destination"

          backup="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "$intent" \
              "$api/backups"
          )"
          test "$(printf '%s' "$backup" | jq --raw-output '.verified')" = 'true'
          backup_name="$(printf '%s' "$backup" | jq --raw-output '.filename')"
          test -f "data/backups/$backup_name"
          test "$(head --bytes 15 "data/backups/$backup_name")" = 'SQLite format 3'

          restore="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "$intent" \
              --header 'Content-Type: application/json' \
              --data '{"confirmation":"RESTORE '"$backup_name"'"}' \
              "$api/backups/$backup_name/restore"
          )"
          test "$(
            printf '%s' "$restore" | jq --raw-output '.restored_from'
          )" = "$backup_name"
          test "$(
            printf '%s' "$restore" | jq --raw-output '.safety_backup.verified'
          )" = 'true'
          curl --fail --silent --show-error "$api/health" \
            | grep --fixed-strings --quiet '"status":"ok"'
      - name: Show container diagnostics after failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
